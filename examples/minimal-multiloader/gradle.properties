# Single source of truth for all versions across all MC lines and loaders.
# Each per-MC subproject reads its row via project.findProperty(...) with
# the <key>_<mc_suffix> scheme (dots in mc version replaced by underscores).
# Do NOT hardcode versions in any subproject build file.

# Project identity
modid=examplemod
mod_name=Example Mod
mod_version=0.1.0
group=com.example.examplemod
license=MIT
authors=modsmith
description=A minimal multi-MC modsmith scaffold for documentation and smoke-testing.

# Top-level :common — pure Java, MC-agnostic. Toolchain set to the
# highest Java version across all targeted MCs (so the bytecode runs on
# every MC line's JVM).
java_version_shared=25

# NeoForge loader version range (shared across all MC lines).
neoforge_loader_version_range=[4,)


# ---- MC 1.21.1 (1_21_1) ----
mc_version_1_21_1=1.21.1
java_version_1_21_1=21
neoform_version_1_21_1=1.21.1-20240808.144430
neoforge_version_1_21_1=21.1.230
fabric_loader_version_1_21_1=0.19.2
fabric_api_version_1_21_1=0.116.12+1.21.1
parchment_mc_version_1_21_1=1.21.1
parchment_version_1_21_1=2024.11.17


# ---- MC 26.1.2 (26_1_2) ----
mc_version_26_1_2=26.1.2
java_version_26_1_2=25
neoform_version_26_1_2=26.1.2-1
neoforge_version_26_1_2=26.1.2.64-beta
fabric_loader_version_26_1_2=0.19.2
fabric_api_version_26_1_2=0.149.1+26.1.2
parchment_mc_version_26_1_2=1.21.1
parchment_version_26_1_2=2024.11.17


# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=false
