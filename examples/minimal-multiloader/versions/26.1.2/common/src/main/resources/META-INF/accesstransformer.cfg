# Example Mod access transformers.
#
# This is the SINGLE SOURCE OF TRUTH for AT/AW across both loaders.
# - NeoForge consumes this file directly (configured in neoforge/build.gradle).
# - Fabric auto-generates examplemod.accesswidener from this file at build time
#   (see the generateAccessWidener task in fabric/build.gradle).
#
# Format:
#   <access>[-f] <fully.qualified.ClassName> [field-or-method-descriptor]
#
# Access levels: public, protected, private, default
# Suffix '-f' strips the `final` modifier in addition to opening access.
#
# Method descriptors use SRG-like obfuscated names (m_XXX_ for methods) OR
# Mojmap names depending on toolchain phase. Prefer Mojmap names; both
# NeoForge and the AT->AW converter understand them.
#
# Examples (uncomment + edit as you need access):
# public net.minecraft.world.entity.Mob someField
# public net.minecraft.world.entity.Mob someMethod()V
# public-f net.minecraft.world.entity.LivingEntity finalField

