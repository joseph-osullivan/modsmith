name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: build (all MC lines)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # One JDK is enough: gradle/gradle-daemon-jvm.properties pins the
      # build JVM, and the per-MC compile toolchains are auto-provisioned
      # by the foojay resolver at build time.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `./gradlew build` is the pre-merge gate: it compiles, tests
      # (:common:test — the Tier-1 suite), and assembles EVERY subproject
      # on every MC line. Per-target builds under-test the scaffold —
      # they skip the common modules' own jars and tests.
      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examplemod-jars
          path: |
            common/build/libs/*.jar
            versions/*/*/build/libs/*.jar
          if-no-files-found: ignore
