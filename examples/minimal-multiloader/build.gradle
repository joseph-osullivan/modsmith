// Root build file for a multi-MC × multi-loader scaffold.
//
// Layering:
//   :common                          — pure Java, no MC, no loader deps
//   :versions:<mc>:common            — MC-touching shared code for that MC
//   :versions:<mc>:fabric            — Loom subproject for that MC
//   :versions:<mc>:neoforge          — MDG (full NeoForge) for that MC
//
// The shared config in `subprojects {}` below applies to every subproject;
// per-MC versions are resolved by each leaf subproject via the
// MC-suffixed gradle.properties keys (e.g. `neoforge_version_26_1_2`).

// NOTE: core Gradle plugins (java-library, idea, ...) must NOT be listed
// with `apply false` — on Gradle 9+ that is a hard error. Subprojects apply
// core plugins directly via `apply plugin:`. The Loom jar registers BOTH
// plugin ids (legacy 'fabric-loom' for obfuscated MC lines,
// 'net.fabricmc.fabric-loom' for unobfuscated 26.x+); declaring one marker
// here puts the jar on the classpath so each per-MC fabric subproject can
// apply whichever id fits its MC line.
plugins {
    id 'idea'
    id 'net.fabricmc.fabric-loom' version '1.15.5' apply false
    id 'net.neoforged.moddev'    version '2.0.141' apply false
}

idea {
    module {
        excludeDirs += file('runs')
        excludeDirs += file('logs')
        excludeDirs += file('.gradle')
    }
}

subprojects {
    // The intermediate container projects (:versions and :versions:<mc>)
    // exist only to nest paths. They must not get the java plugin — that
    // would produce junk jars (versions-x.y.z.jar etc.) on `./gradlew build`.
    // Containers are the only subprojects with children; skip them.
    if (!project.childProjects.isEmpty()) {
        return
    }

    apply plugin: 'java-library'

    def modid             = project.findProperty('modid')
    def modName           = project.findProperty('mod_name')
    def modVersion        = project.findProperty('mod_version')
    def modGroup          = project.findProperty('group')

    // Every subproject must have DISTINCT (group, name) module coordinates.
    // Gradle names modules by directory basename, so :common,
    // :versions:<mcA>:common and :versions:<mcB>:common would otherwise all
    // publish as <group>:common — and `project(':common')` inside a per-MC
    // common then resolves to the per-MC project ITSELF, yielding a
    // compileJava self-cycle on plain `./gradlew build`. Suffix the group
    // with the MC segment for everything under :versions.
    if (project.path.startsWith(':versions:')) {
        def mcSegment = project.path.split(':')[2].replace('.', '_').replace('-', '_')
        group = "${modGroup}.mc${mcSegment}"
    } else {
        group = modGroup
    }
    version = modVersion

    // Each leaf subproject sets its own archivesName once it knows its MC.
    // (Top-level :common is MC-agnostic, so it just uses project.name.)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
        maven {
            name = 'NeoForged'
            url  = uri('https://maven.neoforged.net/releases')
        }
        maven {
            name = 'Fabric'
            url  = uri('https://maven.fabricmc.net/')
        }
        maven {
            name = 'ParchmentMC'
            url  = uri('https://maven.parchmentmc.org/')
        }
        maven {
            name = 'BlameJared'
            url  = uri('https://maven.blamejared.com/')
        }
        maven {
            name = 'Modrinth'
            url  = uri('https://api.modrinth.com/maven')
            content {
                includeGroup 'maven.modrinth'
            }
        }
        maven {
            name = 'CurseMaven'
            url  = uri('https://cursemaven.com')
            content {
                includeGroup 'curse.maven'
            }
        }
    }

    tasks.withType(Jar).configureEach {
        // init records the SPDX id but does not generate license text; the
        // jar copy only applies once a LICENSE file exists at the repo root.
        def licenseFile = rootProject.file('LICENSE')
        if (licenseFile.exists()) {
            from(licenseFile) {
                rename { "${it}_${modName}" }
            }
        }
        manifest {
            attributes([
                'Specification-Title'    : modName,
                'Specification-Vendor'   : project.findProperty('authors'),
                'Specification-Version'  : modVersion,
                'Implementation-Title'   : project.name,
                'Implementation-Version' : modVersion,
                'Implementation-Vendor'  : project.findProperty('authors')
            ])
        }
    }
}
